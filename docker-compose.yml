services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-borrowcircle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-borrowcircle}
      POSTGRES_DB: ${POSTGRES_DB:-borrowcircle}
    ports:
      # Host port is remapped because a native (non-Docker) PostgreSQL was
      # already bound to 5432 on this machine; override with
      # POSTGRES_HOST_PORT if you need a different one.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  postgres_data:
